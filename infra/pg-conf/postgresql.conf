# LibreJustice — configuration Postgres de la stack.
#
# Ce fichier porte ce que l'application EXIGE pour fonctionner (extensions,
# réglages ParadeDB, compression TOAST) et des valeurs de dimensionnement
# volontairement modestes : elles conviennent à une machine de développement et
# doivent être relevées pour une instance de production, en fonction de sa RAM
# et de son nombre de cœurs. Les repères sont donnés au fil du texte.
#
# Monté en :ro par docker-compose sur /etc/postgresql. C'est la source unique :
# pas d'ALTER SYSTEM, qui écrirait dans postgresql.auto.conf (PGDATA) et
# prendrait silencieusement le pas sur ce fichier. Un pg_reload_conf() suffit
# pour tout GUC de contexte sighup/superuser/user édité ici.

# ── Extensions : requises, ne pas retirer ──
# pg_search (BM25) et vchord (ANN) portent la recherche hybride ; pg_cron les
# tâches planifiées en base ; pg_prewarm recharge au démarrage les buffers
# résidents (son autoprewarm ne couvre QUE shared_buffers).
shared_preload_libraries = 'pg_search,vchord,pg_cron,pg_stat_statements,pg_prewarm'
pg_stat_statements.track = all

# ── Stockage ──
# lz4 plutôt que le pglz historique : sur des corps de décisions, ~4× plus
# rapide en compression et ~1,5× en décompression pour +2,7 % de taille
# S'applique aux valeurs écrites ensuite.
default_toast_compression = lz4

# ── ParadeDB / pg_search ──
# pg_search émet un WARNING par requête dès qu'un agrégat ne passe pas par son
# Aggregate Scan (join, colonne de group by hors index). Purement diagnostique,
# mais chaque recherche en produit une dizaine : coupé pour ne pas noyer les
# journaux.
paradedb.check_aggregate_scan = off

# Segment mutable de pg_search : tampon d'écriture non tokenisé. Le prix est à
# la LECTURE — chaque scan retokenise le tampon entier, ~0,5–1 ms par ligne
# bufferisée, quel que soit le prédicat, y compris une requête sans match. Au
# défaut de 1000 lignes, un index plein coûte ~1 s de plancher par scan. 50
# plafonne la taxe à ~50 ms, au prix d'environ +45 % sur l'insert dans le pire
# cas. Le GUC est lu côté ÉCRIVAIN : il doit vivre ici, pas dans une session.
# Il ne draine PAS un tampon déjà gonflé — seul REINDEX INDEX CONCURRENTLY le
# fait, une fois par index existant.
paradedb.global_mutable_segment_rows = 50

# ── Dimensionnement — À AJUSTER À LA MACHINE ──
# Repères : shared_buffers ≈ 25 % de la RAM (davantage si la base tient en
# mémoire et que les index de recherche doivent y rester résidents),
# effective_cache_size ≈ RAM disponible (simple indice pour le planner, pas une
# allocation), work_mem à multiplier par le nombre de tris concurrents.
shared_buffers = 512MB
effective_cache_size = 2GB
work_mem = 16MB
# Ne pas augmenter à l'aveugle : au-delà, les opérations de maintenance
# (VACUUM FULL, REINDEX, build d'index vchord) peuvent devenir plus lentes.
maintenance_work_mem = 128MB
max_connections = 50

# Garder les gathers en deçà du nombre de cœurs, pour laisser de la place aux
# requêtes concurrentes de l'application.
max_parallel_workers_per_gather = 2
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_maintenance_workers = 2

# ── Écritures de fond ──
# Checkpoints rares et flush étalé : écriture douce, moins de full-page writes.
# Les défauts de Postgres (max_wal_size=1GB, timeout=5min) provoquent trop de
# checkpoints sous une charge d'ingestion.
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_timeout = 30min
# ÷ le volume WAL, surtout les full-page qui suivent un checkpoint. Coût CPU
# négligeable.
wal_compression = zstd

# Sur SSD/NVMe avec des index chauds résidents, le défaut 4 (pensé pour un
# disque rotatif) sur-pénalise l'index scan et peut basculer le planner en seq
# scan. 1.1 garde l'accès indexé.
random_page_cost = 1.1

# Réplication : marge de WAL conservée pour un pg_rewind incrémental depuis une
# instance secondaire. Relever si le secondaire peut décrocher longtemps.
wal_keep_size = 1GB

# ── Journalisation ──
log_min_duration_statement = 1s
log_line_prefix = '%m [%p] app=%a %q%u@%d '

# ── Réseau ──
# Écoute sur toutes les interfaces DU CONTENEUR ; l'isolation est faite en
# amont par docker-compose, qui ne publie le port que sur 127.0.0.1.
listen_addresses = '*'
hba_file = '/etc/postgresql/pg_hba.conf'
