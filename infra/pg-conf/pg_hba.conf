# LibreJustice — pg_hba.conf de la stack.
#
# Monté en :ro par docker-compose ; remplace le pg_hba.conf généré dans PGDATA
# (hba_file dans postgresql.conf). Le conteneur n'est joignable que depuis
# 127.0.0.1, compose ne publiant pas le port ailleurs : l'isolation réseau est
# faite en amont, ce fichier ne la remplace pas.

# TYPE  DATABASE    USER        ADDRESS         METHOD

# Connexions Unix locales au conteneur (healthcheck, psql interne).
local   all         all                         trust

# Connexions réseau depuis l'hôte.
host    all         all         127.0.0.1/32    scram-sha-256
host    all         all         ::1/128         scram-sha-256

# Réseau du conteneur (l'application joint « postgres » par le réseau compose).
host    all         all         all             scram-sha-256

# Réplication : pg_basebackup / pg_rewind vers une instance secondaire.
local   replication all                         trust
host    replication all         127.0.0.1/32    trust
host    replication all         ::1/128         trust
host    replication all         all             scram-sha-256
