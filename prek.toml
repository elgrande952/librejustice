# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

# Hygiène de fichiers. AUCUN shim git n'est installé et rien ne réinstalle
# (ADR 0354). Ces hooks-là RÉÉCRIVENT les fichiers (whitespace, fin de fichier),
# donc ils ne peuvent pas tourner dans le checkout partagé : ils écraseraient
# l'édition en cours d'un voisin. Ils tournent dans le worktree jetable de
# `mise run ci`, où réécrire ne coûte rien et où un arbre devenu sale EST le
# verdict (ADR 0375). `prek run -a` reste utilisable à la main, à condition de
# l'accepter sur son propre arbre.
#
# Aucun `stages` déclaré : il n'y a pas de shim, donc pas d'étape git à nommer,
# et un stage nommé ici rendait `prek run -a` silencieusement vide.

[[repos]]
repo = "builtin"
hooks = [
  # vendor/** : dépendances tierces vendorées (bundles minifiés) — jamais reformatées.
  # .agents/skills/** : skills épinglés depuis l'amont (`npx skills add`) — les
  # reformater crée une dérive que la mise à jour suivante réécrit.
  # collocations_fr.json : lexique généré (git-lfs) par `lj-bench mine-collocations`,
  # jamais édité à la main — exempté des text-fixers comme les bundles vendorés.
  # docs/working-notes/** : notes de travail, dont des snapshots capturés verbatim
  # (HTML/DOM rendu, dumps JSON) — artefacts de référence jamais édités à la main,
  # exemptés des text-fixers comme les bundles vendorés.
  # --markdown-linebreak-ext : deux espaces en fin de ligne d'un `.md` sont une
  # coupure de ligne volontaire, pas de la saleté (ADR 0021 en porte).
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"], exclude = { glob = ["**/vendor/**", ".agents/skills/**", "packages/lj-core/data/collocations_fr.json", "docs/working-notes/**"] }, pass_filenames = true },
  # citation_aliases.rs : table d'alias de résolution curée à la main, grossit
  # vague après vague (ponts datés FR/UE) — source légitime, pas une donnée binaire
  # accidentelle. Plafond relevé à 400 KB pour lui laisser de la marge.
  # gt/gold/*.jsonl : couche vivante gold (ADR 0148 §3) — git plain à dessein
  # (diffs d'annotation revus ligne à ligne, exception LFS dans .gitattributes).
  { id = "check-added-large-files", args = ["--maxkb=400", "--enforce-all"], exclude = { glob = ["apps/lj-bench/gt/gold/*.jsonl"] }, pass_filenames = true },
  { id = "end-of-file-fixer", exclude = { glob = ["**/vendor/**", ".agents/skills/**", "packages/lj-core/data/collocations_fr.json", "docs/working-notes/**"] }, pass_filenames = true },
  { id = "check-yaml", pass_filenames = true },
  { id = "check-toml", pass_filenames = true },
  { id = "check-merge-conflict", pass_filenames = true }
]

# Le seul Python du repo est du script (harness de sourcing, tâches, bootstrap) :
# on y cherche des défauts, pas de la modernisation — le jeu de règles vit dans
# `ruff.toml`. Hook en LECTURE SEULE, sans `--fix` : mesuré le 11/08, aucune
# forme de hook ne remise quoi que ce soit sous `prek run -a` (ni distante, ni
# locale) ; ce qui écrase un travail en cours, c'est un hook qui réécrit.
# `--force-exclude` : prek passe les noms de fichiers, et sans ça ruff ignore
# ses propres exclusions.
[[repos]]
repo = "local"
hooks = [
  { id = "ruff", name = "ruff", entry = "ruff check --force-exclude", language = "system", types = ["python"], pass_filenames = true }
]
