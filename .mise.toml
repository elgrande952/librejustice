[settings]
experimental = true

[env]
_.file = [".env", ".env.admin", ".env.local", ".env.mistral"]

# L'environnement de déploiement est décidé par le lanceur : `deploy-from-tree`
# exporte prod, le conteneur cron impose prod, `beta.sh` impose beta. Ici, le
# repli de tout lancement à la main. Pas dans `.env`, qui est injecté tel quel
# dans les conteneurs : ce serait y poser dev pour le faire écraser ensuite.
LIBREJUSTICE_API_DEPLOYMENT_ENVIRONMENT = "dev"
LIBREJUSTICE_DEPLOYMENT_ENVIRONMENT = "dev"

# La toolchain Rust est pinnée par `rust-toolchain.toml`, via rustup. Ce qui
# suit est de l'outillage ops/dev : node pour `npx`, uv pour podman-compose
# (le `podman compose` intégré ne gère pas `--profile`), prek pour l'hygiène de
# fichiers, usage pour les flags de task, age pour chiffrer les sauvegardes et
# les relire (le backend aqua fournit `age` ET `age-keygen`, contrairement à ubi ;
# pin majeur parce que le format de fichier est stable en v1).
#
# `hurl` vient du paquet de la distribution, pas d'ici : le tarball amont est
# lié à `libxml2.so.2`, soname qu'Ubuntu ne fournit plus.
[tools]
node = "24"
uv = "latest"
prek = "latest"
usage = "latest"
age = "1"
"cargo:cargo-hakari" = "0.9.39"

[tasks.clippy]
description = "clippy -D warnings sur le workspace, seul, sans le format."
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.lint]
description = "Linters Rust (rustfmt --check + clippy -D warnings)"
run = """
cargo fmt --all --check
mise run clippy
"""

[tasks.test-only]
description = "Tous les tests du workspace SANS le lint (cargo test, sans DB) : query/RRF/signals/rerank, extraction (oracle_parity), chunking, legal-refs, DTOs, SSR SEO."
run = "cargo test --workspace --tests"

[tasks.test]
description = "Lint Rust + tous les tests du workspace + le serveur MCP local"
depends = ["lint"]
run = """
cargo test --workspace --tests
uv run pytest mcp -q
"""

[tasks.ensure-pg]
description = "Prépare l'état Postgres de state_dir : propriétaire de pgdata (uid 999 rootless) et conf montée en /etc/postgresql."
run = """
mkdir -p "$LIBREJUSTICE_STATE_DIR/pgdata"
# Rootless : postgres tourne en uid 999 dans le conteneur ; le dossier hôte doit
# appartenir au subuid mappé, sinon `mkdir /var/lib/postgresql/18` est refusé au
# tout premier démarrage. Idempotent (no-op une fois la base initialisée).
podman unshare chown 999:999 "$LIBREJUSTICE_STATE_DIR/pgdata"

pgconf="${LIBREJUSTICE_PG_CONF_DIR:-infra/pg-conf}"
mkdir -p "$LIBREJUSTICE_STATE_DIR/pg-conf"
cp -f "$pgconf/postgresql.conf" "$pgconf/pg_hba.conf" "$LIBREJUSTICE_STATE_DIR/pg-conf/"
echo "conf postgres : $pgconf -> $LIBREJUSTICE_STATE_DIR/pg-conf (relire exige un restart du conteneur)"
"""

[tasks.dbs]
description = "Infra locale (postgres) — sans cron ni app"
depends = ["ensure-pg"]
run = """
podman compose -f infra/docker-compose.yml up -d --no-recreate postgres
"""

# `lj-server` sert l'API, MCP, le SSR Leptos et ses assets sur :3000, rebâti par
# cargo-leptos à chaque changement (hot-reload :3001). La base est celle de
# `LIBREJUSTICE_DB_URL` : aucun Postgres local requis.
[tasks.dev]
description = "lj-server fusionné (API + MCP + SSR Leptos, :3000), compilé une fois et arrêté au bout de 2 h ; DB = LIBREJUSTICE_DB_URL (.env → prod)"
env = { LIBREJUSTICE_API_DEPLOYMENT_ENVIRONMENT = "dev", LIBREJUSTICE_API_PUBLIC_BASE_URL = "http://localhost:3000" }
depends = ["build-skill-zips"]
# No watch, and a lifetime: two watchers left behind ran 2 and 4 days on the
# prod host, rebuilding on every neighbour's edit.
run = "timeout 2h cargo leptos serve --project librejustice-dev"

# Zips des skills du plugin servis par /mcp-guide (upload claude.ai :
# le zip contient le dossier de la skill à sa racine). Générés au build,
# gitignorés — la source de vérité reste plugins/librejustice/skills/.
[tasks.build-skill-zips]
description = "Zippe plugins/librejustice/skills/* vers packages/lj-web/public/skills/ (téléchargement /mcp-guide)."
run = """
python3 - <<'EOF'
import pathlib, zipfile
src = pathlib.Path('plugins/librejustice/skills')
out = pathlib.Path('packages/lj-web/public/skills')
out.mkdir(parents=True, exist_ok=True)
for skill in sorted(p for p in src.iterdir() if p.is_dir()):
    zpath = out / f'{skill.name}.zip'
    with zipfile.ZipFile(zpath, 'w', zipfile.ZIP_DEFLATED) as z:
        for f in sorted(skill.rglob('*')):
            if f.is_file():
                z.write(f, f.relative_to(src))
    print(zpath)
EOF
"""

[tasks.deploy-staging]
env = { LIBREJUSTICE_API_DEPLOYMENT_ENVIRONMENT = "staging", LIBREJUSTICE_API_DB_APPLICATION_NAME = "librejustice-api-staging" }
depends = ["ensure-pg"]
run = """
podman compose -f infra/docker-compose.yml --profile staging up -d --build --force-recreate
"""

[tasks.precompress]
description = "Précompresse /pkg (wasm/js/css) en brotli q11 + gzip -9 ; ServeDir.precompressed_* les sert tels quels (zéro recompression par requête, cf. lj-server). À lancer après `cargo leptos build --release`."
run = """
site="${LEPTOS_SITE_ROOT:-target/site}"
# Keyed on content: the redaction modules, OCR data and fonts rarely change,
# and brotli -q 11 costs ~3 s per MB on this host.
cache="${LIBREJUSTICE_STATE_DIR:-$HOME/.local/share/librejustice}/cache/precompress"
mkdir -p "$cache"
# Noms content-hashés (`hash-files = true`) : lj-web.<sha256>.{wasm,js,css}.
# The redaction module and its viewer are compressed HERE rather than where they
# are built: they travel through `public/`, whose copy by cargo-leptos truncated
# a `.gz` at 256 KB on 21/09, which the browser read as an amputated module.
for f in "$site"/pkg/lj-web.*.wasm "$site"/pkg/lj-web.*.js "$site"/pkg/lj-web.*.css \
         "$site"/redactor/*.wasm "$site"/redactor/*.js \
         "$site"/redactor/fonts/*.ttf "$site"/redactor/fonts/*.otf "$site"/redactor/cmaps/*.cmap \
         "$site"/ocr/*.wasm "$site"/ocr/*.js "$site"/ocr/*.traineddata; do
  [ -f "$f" ] || continue
  key="$cache/$(sha256sum "$f" | cut -c1-64)"
  if [ ! -f "$key.gz" ]; then
    gzip -9 -c "$f" > "$key.gz.tmp" && mv "$key.gz.tmp" "$key.gz"
  fi
  if [ ! -f "$key.br" ]; then
    if command -v brotli >/dev/null 2>&1; then
      brotli -q 11 -c "$f" > "$key.br.tmp"
    else
      python3 -c "import brotli,sys; sys.stdout.buffer.write(brotli.compress(open(sys.argv[1],'rb').read(),quality=11))" "$f" > "$key.br.tmp"
    fi
    mv "$key.br.tmp" "$key.br"
  fi
  touch "$key.gz" "$key.br"
  cp "$key.gz" "$f.gz"
  cp "$key.br" "$f.br"
done
find "$cache" -type f -mtime +14 -delete
"""

[tasks.clean]
description = "Récupère du disque côté user (rapide, sans sudo) : caches de compilation incrémentale Cargo (target/*/incremental) + images podman dangling. Garde les rlibs de deps → rebuild incrémental rapide derrière."
run = """
rm -rf target/*/incremental
podman image prune -f
"""

# The `/redact` module, outside the hydration bundle, which must not grow for
# one page: fetched only when a document is opened, it reads a PDF, a scan and
# a Word document, and draws their pages as SVG.
[tasks.redact-wasm]
description = "Builds the browser redaction module into lj-web/public, whence cargo-leptos copies it into the bundle (served under /redactor)."

run = """
export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
site="packages/lj-web/public"
rm -f "$site"/redactor/*.js "$site"/redactor/*.wasm
rustup target add wasm32-unknown-unknown
CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS="-C target-feature=+simd128" \
  cargo build -p lj-redact --target wasm32-unknown-unknown --profile redact-release --locked \
    --target-dir target/redact
# Bound once per content of the module: 3 s of CPU per run otherwise. Files only:
# a cached directory in 0700 carried its mode onto public/redactor, unreadable.
wasm=target/redact/wasm32-unknown-unknown/redact-release/lj_redact.wasm
bound="${LIBREJUSTICE_STATE_DIR:-$HOME/.local/share/librejustice}/cache/bindgen/$({ sha256sum < "$wasm"; echo lj_redact; wasm-bindgen --version; } | sha256sum | cut -c1-64)"
if [ ! -d "$bound" ]; then
  wasm-bindgen --target web --no-typescript --out-dir "$bound.tmp" --out-name lj_redact "$wasm"
  mv "$bound.tmp" "$bound"
fi
touch "$bound"
cp -a "$bound"/* "$site/redactor"/
{ cat packages/lj-pdf/NOTICE; echo; cat packages/lj-office/NOTICE; } > "$site/redactor/NOTICE.txt"
find "${bound%/*}" -mindepth 1 -maxdepth 1 -mtime +14 -exec rm -rf {} +
"""

[tasks.htr-wasm]
description = "Builds the slow reader's module into lj-web/public/redactor/htr, whence cargo-leptos copies it into the bundle (served under /redactor/htr)."
run = """
export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
site="packages/lj-web/public/redactor/htr"
# public/redactor is ignored by git, and htr-assets, which also creates this
# directory, runs after this task in build-app: a fresh tree has no htr/ yet.
mkdir -p "$site"
rm -f "$site"/*.js "$site"/*.wasm
rustup target add wasm32-unknown-unknown
CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS="-C target-feature=+simd128" \
  cargo build -p lj-htr --target wasm32-unknown-unknown --profile htr-release --locked \
    --target-dir target/htr
# Bound once per content of the module: 7 s of CPU per run otherwise.
wasm=target/htr/wasm32-unknown-unknown/htr-release/lj_htr.wasm
bound="${LIBREJUSTICE_STATE_DIR:-$HOME/.local/share/librejustice}/cache/bindgen/$({ sha256sum < "$wasm"; echo lj_htr; wasm-bindgen --version; } | sha256sum | cut -c1-64)"
if [ ! -d "$bound" ]; then
  wasm-bindgen --target web --no-typescript --out-dir "$bound.tmp" --out-name lj_htr "$wasm"
  mv "$bound.tmp" "$bound"
fi
touch "$bound"
cp -a "$bound"/* "$site"/
find "${bound%/*}" -mindepth 1 -maxdepth 1 -mtime +14 -exec rm -rf {} +
"""

# The slow reader's networks, converted once per pin: the handwriting reader
# ships as a PyTorch checkpoint, exported here, which wants PyLaia and Torch.
# Each file vendored here is listed, with its licence, in
# packages/lj-web/public/third-party-licenses.txt.
[tasks.htr-assets]
description = "Vendors the slow reader's networks and lexicon into lj-web/public/redactor/htr/models (served under /redactor/htr/models, fetched only when the pages are read as handwriting)."
run = """
det="e6f4fa85f00e168c862bc462aebca69eef9b3d3d"
paddle="7b02d0a30a07ba2b92ad1ff5a8941ae2c633de65"
laia="270d9e1d4ccfa1047a4e617f2af3df40f3074fed"
words="525f9b560de45753a5ea01069454e72e9aa541c6"
key=$(echo "$det $paddle $laia $words" | cat - apps/lj-htr/models.py | sha256sum | cut -c1-16)
vendor="$LIBREJUSTICE_STATE_DIR/vendor/htr-$key"
site="packages/lj-web/public/redactor/htr/models"
licenses="
3840c5c0c61c294264d2dd77b8777be6ddd90121ef4e0e64abcd22edea581d6e PaddleOCR-LICENSE.txt https://raw.githubusercontent.com/PaddlePaddle/PaddleOCR/b03f46425e8ff4442b268ce449e3eef758146cd4/LICENSE
1378695bd756232909fd2668310ad6d8c3ee314e05698c15b747660623ab2ba4 pylaia-rimes-README.md https://huggingface.co/Teklia/pylaia-rimes/raw/270d9e1d4ccfa1047a4e617f2af3df40f3074fed/README.md
a92fcc50e27f7b2d5860ec1c1ce794dc4c892d945bfa4c8c3136cdfd213ee710 FrequencyWords-README.md https://raw.githubusercontent.com/hermitdave/FrequencyWords/525f9b560de45753a5ea01069454e72e9aa541c6/README.md
b05785f9f18e6716bab63424b11454513b9943a222595b70411009202fc592b5 MIT.txt https://raw.githubusercontent.com/spdx/license-list-data/31ba1a50e5397e00a304dbadc76531740e89ee48/text/MIT.txt
"
held="$LIBREJUSTICE_STATE_DIR/vendor/htr-licenses-$(printf '%s' "$licenses" | sha256sum | cut -c1-12)"
if [ ! -f "$held/.complete" ]; then
  rm -rf "$held"
  mkdir -p "$held"
  printf '%s' "$licenses" | while read -r sum name url; do
    [ -n "$sum" ] || continue
    curl -fsSL -o "$held/$name" "$url"
    echo "$sum  $held/$name" | sha256sum -c --quiet
  done
  touch "$held/.complete"
fi
if [ ! -f "$vendor/.complete" ]; then
  rm -rf "$vendor"
  # Torch, its environment and the interpreter live here and leave with it.
  scratch=$(mktemp -d)
  trap 'rm -rf "$scratch"' EXIT
  mkdir -p "$scratch/downloads"
  fetch() {
    curl -fsSL -o "$scratch/downloads/$1" "$2"
    echo "$3  $scratch/downloads/$1" | sha256sum -c --quiet
  }
  hf="https://huggingface.co"
  fetch det.onnx "$hf/PaddlePaddle/PP-OCRv5_mobile_det_onnx/resolve/$det/inference.onnx" \
    a431985659dc921974177a95adcfbb90fd9e51989a5e04d70d0b75f597b6e61d
  fetch rec.onnx "$hf/monkt/paddleocr-onnx/resolve/$paddle/languages/latin/rec.onnx" \
    614ffc2d6d3902d360fad7f1b0dd455ee45e877069d14c4e51a99dc4ef144409
  fetch dict.txt "$hf/monkt/paddleocr-onnx/resolve/$paddle/languages/latin/dict.txt" \
    3c0a8a79b612653c25f765271714f71281e4e955962c153e272b7b8c1d2b13ff
  fetch model "$hf/Teklia/pylaia-rimes/resolve/$laia/model" \
    e50c1ec3ff00c86c448634987e05f135cbd8017b39f2389ec032fc8f0f99ff6f
  fetch weights.ckpt "$hf/Teklia/pylaia-rimes/resolve/$laia/weights.ckpt" \
    b24aa78625c3c5cfbd07926aee3d5890dec2d7aab931a1c55bdbe6770236a8aa
  fetch syms.txt "$hf/Teklia/pylaia-rimes/resolve/$laia/syms.txt" \
    ad1f4574e53658cc972ee0ce9f664fefd1061624c9664ff9a9ec371aaa0d9e66
  for pair in fr:f81f7c570b6433764da99aa30f4dfb08d81c5926301377b709af23a13b1f9596 \
      en:5351ff405b1126ef555791dd4d9798a48e3e9a501a9fc481a9da957752cfb458 \
      de:d9e50546fd7e8b6fe6542a2b33c51d1331092b2a3916ec09f80d97856068705b \
      es:dcff3ad4316192f4dc4ff7d26e637c6ff314ef1ca0f3f720c5649018a71056c0 \
      it:bb96cdcb56d28342c1e909db6b2525448b7767136b7e86a2ccc649a1be66fc19 \
      pt:f97704382f97273ff59488b1885e7ac90d20f81fd92e5fbad3e3ce43633f495c \
      nl:099bd0c27b514d54284360ad9ce2b4ef7b6903b22e848b67ab10f6aa2adb4baa; do
    lang="${pair%%:*}"
    fetch "lexicon-$lang.txt" \
      "https://raw.githubusercontent.com/hermitdave/FrequencyWords/$words/content/2018/$lang/${lang}_50k.txt" "${pair#*:}"
  done
  UV_CACHE_DIR="$scratch/uv" UV_PYTHON_INSTALL_DIR="$scratch/python" \
    uv run --quiet --no-config --managed-python \
    --index https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match \
    apps/lj-htr/models.py "$scratch/downloads" "$vendor/site"
  touch "$vendor/.complete"
fi
rm -rf "$site"
mkdir -p "$site/licenses"
cp "$vendor"/site/* "$site/"
cp "$held"/* "$site/licenses/"
"""

# The Adobe CMaps the module parses as text, fetched only for a PDF whose text
# names one: the set hayro-cmap embeds natively, read from the repository it is
# built from, with the CID to Unicode tables that repository adds.
# Each file vendored here is listed, with its licence, in
# packages/lj-web/public/third-party-licenses.txt.
[tasks.pdf-cmaps]
description = "Vendors the predefined Adobe CMaps into lj-web/public/redactor/cmaps (served under /redactor/cmaps, fetched only for a PDF that names one)."
run = """
rev="5d490e4b9af819322500d8409ac61eecdb6e8d93"
sum="1c6d86862fc85be0fa452d4ed8d6955be33607b1b26990022c7bfa478aa4980d"
vendor="$LIBREJUSTICE_STATE_DIR/vendor/cmap-resources-$rev"
site="packages/lj-web/public/redactor/cmaps"
if [ ! -f "$vendor/.complete" ]; then
  rm -rf "$vendor"
  mkdir -p "$vendor"
  curl -fsSL -o "$vendor/src.tar.gz" "https://github.com/LaurenzV/cmap-resources/archive/$rev.tar.gz"
  echo "$sum  $vendor/src.tar.gz" | sha256sum -c --quiet
  tar -xzf "$vendor/src.tar.gz" -C "$vendor" --strip-components 1
  rm "$vendor/src.tar.gz"
  touch "$vendor/.complete"
fi
rm -rf "$site"
mkdir -p "$site"
for name in 83pv-RKSJ-H 90ms-RKSJ-H 90ms-RKSJ-V 90msp-RKSJ-H 90msp-RKSJ-V 90pv-RKSJ-H \
    Add-RKSJ-H Add-RKSJ-V Adobe-CNS1-UCS2 Adobe-GB1-UCS2 Adobe-Japan1-UCS2 Adobe-Korea1-UCS2 \
    B5pc-H B5pc-V CNS-EUC-H CNS-EUC-V ETen-B5-H ETen-B5-V ETenms-B5-H ETenms-B5-V EUC-H EUC-V \
    Ext-RKSJ-H Ext-RKSJ-V GB-EUC-H GB-EUC-V GBK-EUC-H GBK-EUC-V GBK2K-H GBK2K-V GBKp-EUC-H \
    GBKp-EUC-V GBpc-EUC-H GBpc-EUC-V H HKscs-B5-H HKscs-B5-V KSC-EUC-H KSC-EUC-V KSCms-UHC-H \
    KSCms-UHC-HW-H KSCms-UHC-HW-V KSCms-UHC-V KSCpc-EUC-H UniCNS-UCS2-H UniCNS-UCS2-V \
    UniCNS-UTF16-H UniCNS-UTF16-V UniGB-UCS2-H UniGB-UCS2-V UniGB-UTF16-H UniGB-UTF16-V \
    UniJIS-UCS2-H UniJIS-UCS2-HW-H UniJIS-UCS2-HW-V UniJIS-UCS2-V UniJIS-UTF16-H UniJIS-UTF16-V \
    UniKS-UCS2-H UniKS-UCS2-V UniKS-UTF16-H UniKS-UTF16-V V; do
  found=$(ls "$vendor"/Adobe-*/CMap/"$name" "$vendor/pdf2unicode/$name" 2>/dev/null | head -1)
  [ -n "$found" ] || { echo "pdf-cmaps: $name absent de cmap-resources $rev" >&2; exit 1; }
  cp "$found" "$site/$name.cmap"
done
cp "$vendor/LICENSE.md" "$site/LICENSE.md"
"""

# One of the five tesseract builds is vendored, LSTM and SIMD: the loader has to
# name that file, or tesseract.js probes for names this folder does not carry.
# Each file vendored here is listed, with its licence, in
