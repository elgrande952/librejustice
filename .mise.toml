vendor="$LIBREJUSTICE_STATE_DIR/vendor/office-fonts-$(printf '%s' "$manifest" | sha256sum | cut -c1-12)"
site="packages/lj-web/public/redactor/fonts"
fonts_dir="${XDG_DATA_HOME:-$HOME/.local/share}/fonts/librejustice-office"
conf="${XDG_CONFIG_HOME:-$HOME/.config}/fontconfig/conf.d/50-librejustice-office.conf"

if [ ! -f "$vendor/.complete" ]; then
  rm -rf "$vendor"
  mkdir -p "$vendor/dl" "$vendor/stage/selawik" "$vendor/fonts/licenses"
  printf '%s' "$manifest" | while read -r sum name url; do
    [ -n "$sum" ] || continue
    curl -fsSL -o "$vendor/dl/$name" "$url"
    echo "$sum  $vendor/dl/$name" | sha256sum -c --quiet
  done
  for t in carlito caladea liberation liberation-narrow; do
    tar -xzf "$vendor/dl/$t.tar.gz" -C "$vendor/stage"
  done
  python3 -m zipfile -e "$vendor/dl/dejavu.zip" "$vendor/stage"
  python3 -m zipfile -e "$vendor/dl/selawik.zip" "$vendor/stage/selawik"
  out="$vendor/fonts"
  cp "$vendor"/stage/crosextrafonts-*/*.ttf "$vendor"/stage/liberation-*/*.ttf \
     "$vendor"/stage/selawik/*.ttf "$vendor"/dl/*.ttf "$vendor"/dl/*.otf "$out/"
  for f in Sans Sans-Bold Sans-Oblique Sans-BoldOblique \
           SansCondensed SansCondensed-Bold SansCondensed-Oblique SansCondensed-BoldOblique \
           Serif Serif-Bold Serif-Italic Serif-BoldItalic \
           SansMono SansMono-Bold SansMono-Oblique SansMono-BoldOblique; do
    cp "$vendor/stage/dejavu-fonts-ttf-2.37/ttf/DejaVu$f.ttf" "$out/"
  done
  cp "$vendor"/dl/*.txt "$out/licenses/"
  mkdir -p "$out/sources"
  cp "$vendor"/dl/*.sfd "$vendor"/dl/*.pe "$vendor"/dl/*.ff "$vendor"/dl/*-Makefile "$out/sources/"
  cp "$vendor/stage/crosextrafonts-carlito-20130920/LICENSE" "$out/licenses/Carlito-LICENSE.txt"
  cp "$vendor/stage/liberation-fonts-ttf-2.1.5/LICENSE" "$out/licenses/Liberation-LICENSE.txt"
  cp "$vendor/stage/liberation-narrow-fonts-ttf-1.07.6/COPYING" "$out/licenses/LiberationSansNarrow-COPYING.txt"
  cp "$vendor/stage/liberation-narrow-fonts-ttf-1.07.6/License.txt" "$out/licenses/LiberationSansNarrow-License.txt"
  cp "$vendor/stage/dejavu-fonts-ttf-2.37/LICENSE" "$out/licenses/DejaVu-LICENSE.txt"
  rm -rf "$vendor/dl" "$vendor/stage"
  touch "$vendor/.complete"
fi

rm -rf "$site"
mkdir -p "$site"
cp -R "$vendor/fonts/." "$site/"

# LibreOffice may be converting while this runs: a file is only rewritten when it changed.
mkdir -p "$fonts_dir" "${conf%/*}"
changed=""
for f in "$vendor"/fonts/*.ttf "$vendor"/fonts/*.otf; do
  cmp -s "$f" "$fonts_dir/${f##*/}" || { cp "$f" "$fonts_dir/"; changed=1; }
done
for f in "$fonts_dir"/*; do
  [ -e "$f" ] || continue
  [ -e "$vendor/fonts/${f##*/}" ] || { rm "$f"; changed=1; }
done
cat > "$conf.new" <<'EOF'
<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias binding="same"><family>Calibri</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Calibri Light</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Cambria</family><prefer><family>Caladea</family></prefer></alias>
  <alias binding="same"><family>Cambria Math</family><prefer><family>Caladea</family></prefer></alias>
  <alias binding="same"><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Helvetica</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Arial Narrow</family><prefer><family>Liberation Sans Narrow</family></prefer></alias>
  <alias binding="same"><family>Times New Roman</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Times</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Courier New</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="same"><family>Courier</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="same"><family>Consolas</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="same"><family>Georgia</family><prefer><family>Gelasio</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Selawik</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Light</family><prefer><family>Selawik Light</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Semilight</family><prefer><family>Selawik Semilight</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Semibold</family><prefer><family>Selawik Semibold</family></prefer></alias>
  <alias binding="same"><family>Verdana</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Trebuchet MS</family><prefer><family>DejaVu Sans Condensed</family></prefer></alias>
  <alias binding="same"><family>Candara</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Corbel</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Constantia</family><prefer><family>Caladea</family></prefer></alias>
  <alias binding="same"><family>Garamond</family><prefer><family>EB Garamond</family></prefer></alias>
  <alias binding="same"><family>Century Gothic</family><prefer><family>URW Gothic</family></prefer></alias>
  <alias binding="same"><family>Book Antiqua</family><prefer><family>P052</family></prefer></alias>
  <alias binding="same"><family>Palatino Linotype</family><prefer><family>P052</family></prefer></alias>
  <alias binding="same"><family>Palatino</family><prefer><family>P052</family></prefer></alias>
  <alias binding="same"><family>Bookman Old Style</family><prefer><family>URW Bookman</family></prefer></alias>
  <alias binding="same"><family>Century Schoolbook</family><prefer><family>C059</family></prefer></alias>
  <alias binding="same"><family>Aptos</family><prefer><family>PT Sans</family></prefer></alias>
  <alias binding="same"><family>Aptos Display</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Aptos Light</family><prefer><family>Selawik Light</family></prefer></alias>
  <alias binding="same"><family>Aptos Narrow</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Aptos Serif</family><prefer><family>Gelasio</family></prefer></alias>
  <alias binding="same"><family>Aptos Mono</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="same"><family>Marianne</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>sans-serif</family><prefer><family>Noto Sans</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>serif</family><prefer><family>Noto Serif</family><family>DejaVu Serif</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
EOF
if cmp -s "$conf.new" "$conf"; then rm "$conf.new"; else mv "$conf.new" "$conf"; fi
[ -z "$changed" ] || fc-cache "$fonts_dir"
"""

# Les artefacts sont compilés sur l'hôte, contre sa glibc, puis précompressés :
# l'image (`infra/Dockerfile.app`) ne fait que les copier. Aucune compilation en
# conteneur. cargo et rustup ne viennent pas des tools mise, d'où le PATH
# explicite.
[tasks.build-app]
description = "Compile lj-server + lj-ingest + assets SSR (release, hôte) et précompresse — artefacts pour l'image fine (infra/Dockerfile.app)."
depends = ["build-skill-zips"]
run = """
export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
rustup target add wasm32-unknown-unknown
# Bundle reconstruit depuis un répertoire vide : l'image fait `COPY target/site
# /app/site`, donc tout fichier étranger qui traîne là part en prod.
rm -rf target/site
mise run redact-wasm
mise run htr-wasm
mise run htr-assets
mise run ocr-assets
mise run office-fonts
mise run pdf-cmaps
# Les deux binaires dans une seule invocation : deux sélections de paquets font
# deux exemplaires compilés de chaque crate partagé, recompilés à chaque build.
# Un argument par occurrence du flag, qui ne découpe pas les espaces.
# The front (wasm, wasm-bindgen, wasm-opt, Tailwind, precompress) only reads the
# hydrate crates and public/: on an unchanged key it is restored, not rebuilt.
# public/redactor stays out of the key: the redaction modules change with every
# lj-office or lj-pdf commit, and are copied over the restored site instead.
# The manifests enter by what the front reads of them: its resolved graph, the profiles, its leptos metadata, this task.
front_cache="${LIBREJUSTICE_STATE_DIR:-$HOME/.local/share/librejustice}/cache/front"
front_graph=$(cargo tree --locked -p lj-web --target wasm32-unknown-unknown \
  --no-default-features -F hydrate -e normal,build --prefix none -f '{p} {f}' \
  | sed -e 's/ ([*])$//' -e "s|$PWD/||g" | sort -u)
front_crates=$(printf '%s\n' "$front_graph" | grep -o '([^)]*/[^)]*)' | tr -d '()' | grep -v :// | sort -u)
front_inputs="$front_crates Cargo.toml Cargo.lock rust-toolchain.toml .mise.toml .cargo"
front_key=""
if [ -z "$(git status --porcelain -- $front_inputs)" ]; then
  front_key=$({
    for path in $front_crates rust-toolchain.toml .cargo; do echo "$path $(git rev-parse "HEAD:$path" 2>/dev/null)"; done
    printf '%s\n' "$front_graph"
    python3 -c 'import json, tomllib; c = tomllib.load(open("Cargo.toml", "rb")); m = tomllib.load(open(".mise.toml", "rb")); print(json.dumps([c["profile"], c["workspace"].get("package"), c["workspace"]["metadata"]["leptos"], m["tasks"]["build-app"]], sort_keys=True))'
    find packages/lj-web/public -path packages/lj-web/public/redactor -prune \
      -o -type f -print0 | sort -z | xargs -0 sha256sum
    cargo leptos --version
    env | grep -E '^(LEPTOS_|RUSTFLAGS=|CARGO_ENCODED_RUSTFLAGS=)' | sort
  } | sha256sum | cut -c1-64)
fi
front_hit=""
if [ -n "$front_key" ] && [ -f "$front_cache/$front_key/hash.txt" ]; then
  front_hit=1
  echo "build-app: front restored from cache $front_key"
  cargo leptos build --release --project librejustice --server-only \
    --bin-cargo-args="-p" --bin-cargo-args="lj-ingest" \
    --bin-cargo-args="--bin" --bin-cargo-args="lj-ingest" \
    --bin-cargo-args="--locked"
  rm -rf target/site
  cp -a "$front_cache/$front_key/site" target/site
  rm -rf target/site/redactor
  cp -a packages/lj-web/public/redactor target/site/redactor
  cp "$front_cache/$front_key/hash.txt" target/release/hash.txt
  touch "$front_cache/$front_key"
else
  cargo leptos build --release --project librejustice \
    --bin-cargo-args="-p" --bin-cargo-args="lj-ingest" \
    --bin-cargo-args="--bin" --bin-cargo-args="lj-ingest" \
    --bin-cargo-args="--locked"
fi
# Un snippet wasm-bindgen n'est pas renommable — son chemin est la clé d'import
# que le binaire wasm déclare, et cargo-leptos l'exclut de son hachage —, alors
# que `/pkg` est servi `immutable` un an. On refuse plutôt que de figer l'URL
# d'un contenu qui change.
if [ -d target/site/pkg/snippets ]; then
  echo "build-app: le bundle porte des snippets wasm-bindgen — ils seraient servis immutable sous une URL figée, à versionner avant de livrer" >&2
  exit 1
fi
# On a hit, only the modules copied over the site are new to its cache.
mise run precompress
if [ -z "$front_hit" ] && [ -n "$front_key" ]; then
  rm -rf "$front_cache/$front_key.tmp"
  mkdir -p "$front_cache/$front_key.tmp"
  cp -a target/site "$front_cache/$front_key.tmp/site"
  cp target/release/hash.txt "$front_cache/$front_key.tmp/hash.txt"
  rm -rf "$front_cache/$front_key"
  mv "$front_cache/$front_key.tmp" "$front_cache/$front_key"
  ls -1dt "$front_cache"/*/ | tail -n +4 | xargs -r rm -rf
fi
# Without its module, /redact shows an empty page and says nothing.
if [ ! -f target/site/redactor/lj_redact_bg.wasm ]; then
  echo "build-app: target/site/redactor/lj_redact_bg.wasm absent du bundle, /redact n'aurait rien a charger" >&2
  exit 1
fi
# Le HTML SSR référence les noms de `hash.txt` : s'ils ne sont pas dans le
# bundle, `/pkg` répond 404 et l'hydratation meurt en silence sur tout le site.
# On refuse de livrer plutôt que de le découvrir en prod.
while read -r kind hash; do
  asset="target/site/pkg/lj-web.${hash}.${kind%:}"
  if [ ! -f "$asset" ]; then
    echo "build-app: $asset annoncé par hash.txt mais absent du bundle" >&2
    exit 1
  fi
done < target/release/hash.txt
# Signe l'arbre bâti : la beta et le deploy lisent cette trace pour savoir si
# l'artefact du worktree est celui de leur arbre.
git rev-parse "HEAD^{tree}" > target/release/arbre-construit
"""

# Purge le cache CDN de la zone. Appelée en fin de deploy, et lançable seule en
# dépannage. La purge est globale : les assets immuables se re-peuplent à la
# première requête, pour un court pic à l'origine.
#
# Ni domaine ni compte en dur : un déploiement qui n'est pas derrière Cloudflare
# ne pose aucune des deux variables et l'étape se saute.
[tasks.cdn-purge]
description = "Purge le cache CDN Cloudflare de LIBREJUSTICE_DOMAIN (chunks /assets après deploy)."
run = """
if [ -z "${LIBREJUSTICE_DOMAIN:-}" ] || [ -z "${LIBREJUSTICE_CLOUDFLARE_MANAGEMENT_TOKEN:-}" ]; then
  echo "cdn-purge : LIBREJUSTICE_DOMAIN ou le jeton Cloudflare absent — étape sautée."
  exit 0
fi
zone=$(curl -fsS "https://api.cloudflare.com/client/v4/zones?name=$LIBREJUSTICE_DOMAIN" \
  -H "Authorization: Bearer $LIBREJUSTICE_CLOUDFLARE_MANAGEMENT_TOKEN" \
  | python3 -c 'import sys,json; print(json.load(sys.stdin)["result"][0]["id"])')
curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$zone/purge_cache" \
  -H "Authorization: Bearer $LIBREJUSTICE_CLOUDFLARE_MANAGEMENT_TOKEN" \
  -H "Content-Type: application/json" \
  --data '{"purge_everything":true}' \
  | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d.get("success"), d.get("errors"); print("✓ CDN Cloudflare purgé")'
"""

[tasks.logs]
run = "podman compose -f infra/docker-compose.yml logs -f"

# Après un restart de Postgres, le pool de l'app garde des connexions tuées et
# les ressert : des 500 intermittents. L'app est donc rebootée dans la foulée.
# Passer par cette tâche, jamais par un `compose restart postgres` nu.
#
# `--recreate` ré-applique la configuration figée à la création du conteneur
# (env, image), qu'un restart ne relit jamais ; il ne sert qu'à ça.
[tasks.db-restart]
description = "Restart (ou --recreate) Postgres puis bounce l'app (pool neuf — évite les 500 post-restart)."
usage = '''
flag "--recreate" help="force-recreate postgres (ré-applique env/image) au lieu d'un simple restart"
'''
run = """
if [ "${usage_recreate:-}" = "true" ]; then
  echo "→ recreate postgres (ré-applique env/image)"
  podman compose -f infra/docker-compose.yml up -d --force-recreate --no-deps postgres
else
  podman compose -f infra/docker-compose.yml restart postgres
fi
for i in $(seq 1 30); do
  podman compose -f infra/docker-compose.yml exec -T postgres pg_isready -U librejustice -d librejustice >/dev/null 2>&1 && break
  sleep 1
done
podman compose -f infra/docker-compose.yml --profile prod restart app
"""

[tasks.smoke]
description = "Smoke tests HTTP sur l'API locale (sans DB)"
run = "hurl --variable api_url=${LIBREJUSTICE_DEV_API_BASE_URL:-http://localhost:8300} tests/smoke/health.hurl --test"

[tasks.smoke-staging]
description = "Smoke tests staging complets (requiert DB + staging up)"
run = "hurl --variable api_url=$LIBREJUSTICE_STAGING_API_BASE_URL tests/smoke/*.hurl --test"

# Contrats HTTP : une seule commande, aucun secret, des fichiers autosuffisants
# (les ids réels sont capturés d'une recherche live). Ils exigent un serveur et
# un corpus ingéré, donc ils ne se jouent que contre une cible déployée. Le
# sous-ensemble déterministe part tout seul en fin de deploy (`contract-deploy`)
# ; la suite complète, qui touche le classement et met une minute, reste à
# lancer à la main après chaque deploy.
#
# `mcp.hurl` est à part : il encode le contrat MCP non authentifié, donc il ne
# se joue que contre un serveur local — la prod exige OAuth et répond 401.
#
# `--jobs 1 --delay 500`: hurl plays the files in parallel by default, which the
# edge rate-limits; one job with a delay passes, 2 min in all.
[tasks.contract]
description = "Contrats HTTP publics contre une cible (défaut prod), sans secret"
run = """
hurl --variable base=${LIBREJUSTICE_CONTRACT_BASE_URL:-https://librejustice.fr} \
  -H "x-lj-origin: ${LIBREJUSTICE_API_INTERNAL_ORIGIN_TOKEN:-}" \
  --jobs 1 --delay 500 \
  tests/contract/health.hurl \
  tests/contract/decisions.hurl \
  tests/contract/search.hurl \
  tests/contract/search-textes.hurl \
  tests/contract/texte-compare.hurl \
  tests/contract/texte-contexte.hurl \
  tests/contract/texte-commentaires.hurl \
  tests/contract/texte-lieu.hurl \
  tests/contract/texte-juridiction.hurl \
  tests/contract/resolution.hurl \
  tests/contract/entities.hurl \
  tests/contract/annonces.hurl \
  tests/contract/oauth.hurl \
  tests/contract/me.hurl \
  tests/contract/auth.hurl \
  tests/contract/api-publique.hurl \
  tests/contract/security-headers.hurl \
  tests/contract/front-build.hurl \
  tests/contract/redactor.hurl \
  --test
"""

# Joué automatiquement en fin de `deploy-prod`, d'où le tri : seuls entrent ici
# les contrats dont le verdict ne dépend ni d'un classement, ni d'un corpus du
# jour, ni d'un amont tiers — sans quoi un rouge intermittent apprend à ignorer
# le rouge. Une dizaine de secondes en tout, jeton MCP compris.
[tasks.contract-deploy]
description = "Sous-ensemble déterministe, joué à chaque deploy (santé, bundle, résolution, chemin authentifié)"
run = """
set -eu
hurl --variable base=${LIBREJUSTICE_CONTRACT_BASE_URL:-https://librejustice.fr} \
  -H "x-lj-origin: ${LIBREJUSTICE_API_INTERNAL_ORIGIN_TOKEN:-}" \
  tests/contract/health.hurl \
  tests/contract/front-build.hurl \
  tests/contract/resolution.hurl \
  tests/contract/redactor.hurl \
  --test
mise run contract-authed
"""

[tasks.contract-mcp]
description = "Contrat MCP non authentifié — serveur local uniquement (prod = OAuth, 401)"
run = "hurl --variable base=${LIBREJUSTICE_CONTRACT_BASE_URL:-http://localhost:3000} -H \"x-lj-origin: ${LIBREJUSTICE_API_INTERNAL_ORIGIN_TOKEN:-}\" tests/contract/mcp.hurl --test"

# Le seul contrôle automatique qui présente une identité valide. `contract` est
# sans secret par construction, donc elle ne teste que le refus : son « bogus
# bearer » attend un 401 et reste vert même si le serveur refuse toutes les
# identités valides. À jouer après chaque deploy, avec `contract`.
#
# Ne provisionne rien : le compte utilisé est celui qu'un agent prend pour être
# connecté à l'app, il existe déjà et survit au run — aucun vrai compte emprunté.
#
# Cible en https obligatoire, le cookie étant `Secure` : la prod, pas la beta,
# servie en clair.
#
# Les identifiants passent par un fichier de variables en 0600 et non par la
# ligne de commande, qui est lisible dans `ps`.
[tasks.contract-authed]
description = "Chemin authentifié de bout en bout (session cookie + MCP + refresh)"
run = """
set -eu
base="${LIBREJUSTICE_CONTRACT_BASE_URL:-https://librejustice.fr}"
: "${LIBREJUSTICE_TEST_ACCOUNT_EMAIL:?absent : compte de test de l'app, à mettre dans .env.admin}"
: "${LIBREJUSTICE_TEST_ACCOUNT_PASSWORD:?absent : mot de passe du compte de test, à mettre dans .env.admin}"
: "${LIBREJUSTICE_TEST_ACCOUNT_API_KEY:?absent : clé ljk_ du compte de test, à mettre dans .env.admin}"

case "$base" in
https://*) ;;
*) echo "contract-authed: $base n'est pas en https, un cookie Secure n'y repartirait pas" >&2
   exit 1 ;;
esac

tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT

umask 077
printf 'base=%s\\nemail=%s\\npassword=%s\\napi_key=%s\\n' \\
  "$base" "$LIBREJUSTICE_TEST_ACCOUNT_EMAIL" "$LIBREJUSTICE_TEST_ACCOUNT_PASSWORD" \\
  "$LIBREJUSTICE_TEST_ACCOUNT_API_KEY" > "$tmp/vars"
hurl --variables-file "$tmp/vars" -H "x-lj-origin: ${LIBREJUSTICE_API_INTERNAL_ORIGIN_TOKEN:-}" tests/contract/authed.hurl --test
"""
