held="$LIBREJUSTICE_STATE_DIR/vendor/ocr-licenses-$(printf '%s' "$licenses" | sha256sum | cut -c1-12)"
if [ ! -f "$held/.complete" ]; then
  rm -rf "$held"
  mkdir -p "$held"
  printf '%s' "$licenses" | while read -r sum name url; do
    [ -n "$sum" ] || continue
    curl -fsSL -o "$held/$name" "$url"
    echo "$sum  $held/$name" | sha256sum -c --quiet
  done
  touch "$held/.complete"
fi

if [ ! -f "$vendor/.complete" ]; then
  rm -rf "$vendor"
  mkdir -p "$vendor"
  for f in tesseract.esm.min.js worker.min.js; do
    curl -fsSL -o "$vendor/$f" "https://cdn.jsdelivr.net/npm/tesseract.js@$tesseract/dist/$f"
  done
  for f in tesseract-core-simd-lstm.js tesseract-core-simd-lstm.wasm; do
    curl -fsSL -o "$vendor/$f" "https://cdn.jsdelivr.net/npm/tesseract.js-core@$core/$f"
  done
  curl -fsSL -o "$vendor/fra.traineddata" \
    "https://github.com/tesseract-ocr/tessdata_fast/raw/$tessdata/fra.traineddata"
  touch "$vendor/.complete"
fi

rm -rf "$site"
mkdir -p "$site"
cp "$vendor"/tesseract.esm.min.js "$vendor"/worker.min.js "$vendor"/tesseract-core-simd-lstm.js \
   "$vendor"/tesseract-core-simd-lstm.wasm "$vendor"/fra.traineddata "$site/"
mkdir -p "$site/licenses"
cp "$held"/*.min.js.LICENSE.txt "$site/"
for f in "$held"/*; do
  case "$f" in *.min.js.LICENSE.txt) ;; *) cp "$f" "$site/licenses/" ;; esac
done
