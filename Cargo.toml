[workspace]
resolver = "2"
# Des globs et non la liste des crates : le manifeste vaut alors pour tout arbre
# qu'on lui donne, quels que soient les membres présents. Corollaire assumé, un
# dossier de `packages/` ou `apps/` sans Cargo.toml fait échouer le chargement :
# ces deux racines ne contiennent que des crates.
members = ["packages/*", "apps/*"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.96"

# Versions récentes et cohérentes. Les crates membres tirent via { workspace = true }.
[workspace.dependencies]
# Async runtime + web
tokio = { version = "1", features = ["full"] }
# Combinateurs de futures (join_all concurrent sur une seule task, sans spawn).
futures = "0.3"
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
# Trait de corps HTTP (`Frame`, `SizeHint`) : version d'axum 0.8 / hyper 1.
http-body = "1"
tower-http = { version = "0.6", features = [
    "cors",
    "trace",
    "compression-gzip",
    "compression-br",
    "fs",
    "set-header",
] }

# Sérialisation
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "alloc"] }
# sonic-rs : parse JSON SIMD sur le hot-path ingest (Judilibre). serde_json ailleurs.
sonic-rs = "0.5"
schemars = { version = "1", features = ["chrono04"] }

# HTTP client. `native-tls-vendored` : OpenSSL compile dans le binaire (aucune
# libssl runtime), pour le seul connecteur annonces/klekoon — son hote ne
# negocie que des suites TLS 1.2 CBC-SHA1, que rustls n'implemente pas.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "form", "rustls", "native-tls-vendored", "gzip", "blocking", "cookies"] }
# Parsing d'URL. Un controle de redirect_uri OAuth compare un HOST, pas un prefixe
# de chaine : `starts_with("http://localhost")` matche `localhost.attaquant.tld`.
url = "2"
# Middleware reqwest : spans HTTP client sortants (equivalent HTTPXClientInstrumentor).
# reqwest-tracing emet un span tracing NATIF (sans la feature opentelemetry_* qui
# epinglerait une vieille version d'otel) -> capte par la couche tracing-opentelemetry.
reqwest-middleware = { version = "0.5", features = ["json", "query"] }
reqwest-tracing = "0.7"

# Postgres (tokio-postgres + deadpool, PAS sqlx)
# pgvector = codec client du type vector(1024) (analogue de register_vector côté
# Python) ; l'ANN reste fait par l'extension VectorChord en SQL brut.
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = "0.14"
pgvector = { version = "0.4", features = ["postgres"] }

# Recherche plein-texte / snippets : crate tantivy NATIF, version EPINGLEE sur
# le core exact wrappe par py-tantivy 0.26 (= crate Rust tantivy 0.26.0, verifie
# dans le .so). Pin strict `=0.26.0` : 0.26.1 a decale les frontieres de fragment
# du SnippetGenerator d'un token -> snippets non byte-identiques a l'oracle. On
# replique 1-pour-1 le tokenizer ParadeDB + le SnippetGenerator de py-tantivy.
tantivy = "=0.26.0"

# XML tolérant
quick-xml = "0.41"

# Texte / regex / single-pass tokenizer
regex = "1"
aho-corasick = "1"
# Diff de rédactions d'articles pour le comparateur de versions.
similar = { version = "3", features = ["unicode"] }
html-escape = "0.2"
# FxHash : hasher non-cryptographique des index de snap citations (lj-extract,
# lookups de chaînes courtes sur le hot-path — SipHash y pesait ~15 % du profil).
rustc-hash = "2"

# Parallélisme
rayon = "1"

# FST (automate minimal, dictionnaire tantivy) : vocabulaire d'autocomplétion,
# construit par lj-ingest et sondé par préfixe dans lj-api.
fst = "0.4"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Erreurs
anyhow = "1"
thiserror = "2"

# Télémétrie : export OTLP/HTTP DIRECT vers Grafana Cloud (plus de collector
# local). http-proto + reqwest-blocking-client = exporteurs sur thread dedie
# des Batch/PeriodicReader (pas de runtime tokio requis) ; le TLS vient de la
# feature rustls deja activee sur `reqwest` (unification additive cargo).
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
# Bridge logs tracing -> OpenTelemetry Logs (export OTLP direct).
opentelemetry-appender-tracing = "0.32"
# Layer axum : spans serveur HTTP nommes {method} {route} + semconv OTel
# (http.route / http.response.status_code) attendus par le cockpit.
axum-tracing-opentelemetry = "0.38"
# base64 : en-tete Authorization Basic des exporteurs OTLP/HTTP Grafana Cloud.
base64 = "0.22"

# Auth / MCP
# jsonwebtoken 10 exige un CryptoProvider explicite. On choisit aws_lc_rs :
# deja tire par reqwest/rustls (un seul provider crypto dans le binaire), ARM ok.
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
# getrandom : octets CSPRNG de l'OS (syscall getrandom(2)) pour les secrets
# OAuth — remplace un read bloquant de /dev/urandom sur le thread async.
getrandom = "0.4"
rmcp = { version = "1", features = ["server", "macros"] }

# Cache in-process (mono-serveur axum) : remplace le conteneur Valkey. moka
# try_get_with coalesce les chargements concurrents = lock anti-stampede natif.
moka = { version = "0.12", features = ["future"] }
zip = "8"
# Export PDF pur-Rust (remplace l'ecriture std a la main). Pas un contrat de
# fil -> parite contenu.
printpdf = { version = "0.9", default-features = false }
# Parsing TTF (cmap + hmtx) pour embarquer une police Unicode dans le PDF :
# printpdf en `default-features=false` n'embarque pas le parseur de police
# (azul-layout) ; on alimente nous-mêmes ses maps glyphes via ttf-parser.
ttf-parser = "0.25"
# Extraction texte PDF born-digital, crate pur Rust : aucune dépendance native.
pdf-extract = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3", "const_xxh64"] }
flate2 = "1"
csv = "1"
# Lecteur d'archives `.tar`, combiné à flate2 pour les `.tar.gz` DILA.
tar = "0.4"

# Calcul / tokenizer HF
ndarray = "0.17"
tokenizers = "0.23"

# Dates : jiff pour la logique métier (parsing dates FR en extraction) ; chrono
# conservé uniquement comme codec timestamptz de tokio-postgres.
# tzdb-bundle-always : l'image de prod (ubuntu:24.04) n'a pas tzdata, or les
# échéances de marchés (lj-core annonces) se posent en Europe/Paris.
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
chrono = { version = "0.4", features = ["serde"] }

# Front SSR/hydration (Leptos 0.8 + cargo-leptos). default-features=false sur
# chaque crate : les features ssr/hydrate fan-out depuis lj-web. wasm-bindgen
# epingle =0.2.108 (force par js-sys 0.3.85 dans l'arbre leptos 0.8.19 ;
# DOIT matcher le wasm-bindgen-cli pilote par cargo-leptos, sinon hydration
# cassee au runtime — confirmer le pin du cli au premier `cargo leptos build`).
leptos = { version = "0.8.19", default-features = false }
leptos_router = { version = "0.8.13", default-features = false }
leptos_meta = { version = "0.8.6", default-features = false }
leptos_axum = { version = "0.8.9", default-features = false }
leptos-fetch = { version = "0.4.10", default-features = false }
# Exécuteur des taches Leptos. DOIT resoudre vers la meme version que celle
# tiree par leptos : c'est un `OnceLock` statique, deux versions donneraient
# deux statics et notre executeur ne remplacerait plus rien. `install()` echoue
# franchement si la course est perdue, plutot que de laisser la panne muette.
any_spawner = "0.3"
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "0.4.58"
js-sys = "0.3.85"
console_error_panic_hook = "0.1.7"
web-sys = "0.3.85"
# Rend `Send` les futures de fetch cote wasm (single-thread) : les Resource
# SSR-primees de la page decision exigent `Fut: Send`, mais reqwest/fetch et le
# shim auth (`JsFuture`) sont `!Send` sur wasm. Meme version que leptos.
send_wrapper = { version = "0.6", features = ["futures"] }

# Workspace-internal crates
lj-core = { path = "packages/lj-core" }
lj-extract = { path = "packages/lj-extract" }
lj-telemetry = { path = "packages/lj-telemetry" }
lj-store = { path = "packages/lj-store" }
lj-sources = { path = "packages/lj-sources" }
lj-llm = { path = "packages/lj-llm" }
lj-dtos = { path = "packages/lj-dtos" }
lj-api = { path = "packages/lj-api" }
lj-web = { path = "packages/lj-web" }

# Serveur HTTP de `lj-server`, pour son `Handle` : lui seul borne le drainage
# des connexions en vol à l'arrêt. Sans `tls-rustls`, le TLS d'origine étant
# terminé par le front `caddy`.
axum-server = { version = "0.7" }

# Projet cargo-leptos multi-crate : le binaire de déploiement `lj-server`
# (API + MCP + SSR + assets) sert tout ; `lj-web` reste la lib
# (cdylib wasm `hydrate` + rlib `ssr`). Les chemins style/assets sont relatifs à
# la racine du workspace.
[[workspace.metadata.leptos]]
name = "librejustice"
bin-package = "lj-server"
lib-package = "lj-web"
output-name = "lj-web"
site-root = "target/site"
site-pkg-dir = "pkg"
tailwind-input-file = "packages/lj-web/style/main.css"
assets-dir = "packages/lj-web/public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
lib-features = ["hydrate"]
lib-default-features = false
# Noms de bundle content-hashés, donc `/pkg` peut être servi `immutable` un an :
# un nouveau build donne de nouveaux noms, et le navigateur ne peut pas hydrater
# un wasm périmé face au HTML SSR neuf. `hash.txt` suit le binaire au
# déploiement, et `LEPTOS_HASH_FILES=true` est posé au runtime.
hash-files = true
js-minify = true
# Profil dédié au bundle wasm : il optimise la taille sans toucher
# `[profile.release]`, que partage le binaire serveur. Pas de
# `wasm-opt-features` : cargo-leptos passe déjà `-Os`, et forcer `-Oz` rend un
# brut plus petit mais un brotli plus gros, l'optimiseur troquant de la
# redondance contre des séquences plus courtes.
lib-profile-release = "wasm-release"

# Projet de développement, sans hashing : les rebuilds incrémentaux de
# `cargo leptos watch` écrivent des noms non hashés sans rafraîchir `hash.txt`
# (cargo-leptos#271), ce qui donne un CSS vide et de fausses erreurs
# d'hydratation.
#
# `site-root` distinct de celui du release : l'image de déploiement fait
# `COPY target/site /app/site`, donc un watcher qui écrirait dans le même
# répertoire ferait embarquer ses assets debug par le deploy, pendant que le
# binaire référence les noms hashés de `hash.txt` — tout `/pkg` en 404.
[[workspace.metadata.leptos]]
name = "librejustice-dev"
bin-package = "lj-server"
lib-package = "lj-web"
output-name = "lj-web"
site-root = "target/site-dev"
site-pkg-dir = "pkg"
tailwind-input-file = "packages/lj-web/style/main.css"
assets-dir = "packages/lj-web/public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
lib-features = ["hydrate"]
lib-default-features = false
hash-files = false

# Projet de la vérification locale, qui ne builde le front que pour
# wasm-bindgen. Il reprend la sélection, les features et les RUSTFLAGS du
# `cargo test --workspace` qui précède : sinon chaque crate partagé a un second
# exemplaire compilé, recompilé à chaque run.
[[workspace.metadata.leptos]]
name = "librejustice-ci"
bin-package = "lj-server"
lib-package = "lj-web"
output-name = "lj-web"
site-root = "target/site-ci"
site-pkg-dir = "pkg"
tailwind-input-file = "packages/lj-web/style/main.css"
assets-dir = "packages/lj-web/public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
lib-features = ["hydrate"]
lib-default-features = false
hash-files = false
bin-default-features = true
bin-cargo-args = ["--workspace"]
# Profil à lui : `cargo test` réécrit le mtime des unités partagées à contenu
# identique, ce qui salit tout ce qui en dépend. Un profil sépare les unités
# sans second `target`.
bin-profile-dev = "ci"
# `--cfg erase_components`, posé par défaut en debug, entre dans l'empreinte mais
# pas dans le nom des unités : mêmes fichiers, deux empreintes, invalidation
# mutuelle à chaque run.
disable-erase-components = true

# Profil des binaires. `codegen-units = 16` et `lto = false` donnent la priorité
# à l'itération sur l'hôte de build, qui compile et déploie sur deux cœurs, le
# thin-LTO étant partiellement sériel. Le coût runtime se compte en centaines de
# microsecondes sur les hot-ops, noyées dans les dizaines de millisecondes de
# DB/ANN/rerank d'une requête. La taille du bundle wasm reste, elle, optimisée
# par `wasm-release` ci-dessous.
[profile.release]
lto = false
codegen-units = 16

# opt-0 sur les deux crates serveur les plus lourds à recompiler : un changement
# en amont de `lj-web` force le recodegen release de cette clôture, qui passe de
# quatre minutes à une. Les dépendances externes restent opt-3, cachées. Le
# bundle wasm est protégé par l'override `wasm-release.package.lj-web` plus bas,
# sinon il hériterait de cet opt-0. En échange, le render SSR double et le
# binaire grossit de 24 Mo.
[profile.release.package.lj-web]
opt-level = 0
[profile.release.package.lj-api]
opt-level = 0

# Profil du bundle wasm (lib hydrate), sélectionné via `lib-profile-release`
# ci-dessus. Optimise la taille : opt-level=z + lto fat + 1 codegen-unit + strip.
# panic=abort : wasm32 n'unwind pas de toute façon, et ça retire le code
# d'unwinding. N'affecte QUE le wasm — le serveur reste sur `[profile.release]`.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Garde l'opt-z du bundle wasm : l'override opt-0 de
# `[profile.release.package.lj-web]` est sinon hérité par `wasm-release`.
# `lj-api` n'est pas dans le graphe wasm, il n'a pas besoin de garde.
[profile.wasm-release.package.lj-web]
opt-level = "z"

# tachys forké : `AnyView` remplit `hydrate_async` pour chaque type erasé sous
# le seul `cfg(hydrate)`, alors que seules les routes lazy l'atteignent — un
# quart du bundle brotli en code mort. Le fork backporte leptos-rs/leptos#4438
# sur la 0.2.15 publiée ; un `[patch]` sur le monorepo amont ferait entrer un
# second `reactive_graph` dans le graphe. À retirer en 0.9, où le gate est
# amont.
[patch.crates-io]
tachys = { git = "https://github.com/librejustice/tachys", rev = "d71bd7442162751080e5ff63d41af45e9a699e75" }

# Un seul profil de développement, partagé par tout le monde : un réglage qui
# diffère d'un poste à l'autre donne deux jeux d'artefacts pour le même code, et
# un worktree neuf recompile alors tout le graphe.
#
# Le debuginfo pilote le coût — `debug = 2` pèse près de 40 % du codegen de
# `lj-web` et alourdit le lien. On y perd `fichier:ligne` dans un backtrace ; le
# message d'un `assert!` les porte encore, et une session de débogage qui a
# besoin des numéros passe `CARGO_PROFILE_DEV_DEBUG=line-tables-only`.
[profile.dev]
debug = 0

# Sélectionné par `bin-profile-dev` du projet `librejustice-ci` ci-dessus. Il
# n'en reste que le nom : c'est lui qui range les unités à part, les réglages
# sont ceux de `dev`.
[profile.ci]
inherits = "dev"
