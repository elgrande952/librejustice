[package]
name = "lj-telemetry"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Init telemetrie des binaires (lj-api, lj-ingest) et `meter()` des libs qui
# posent un instrument (lj-llm) : subscriber tracing + export OTLP/HTTP direct
# vers Grafana Cloud (traces + logs + metriques), scrub PII, guard de flush.
[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
lj-workspace-hack = { version = "0.1", path = "../lj-workspace-hack" }
