[package]
name = "lj-extract"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Étage d'ingest : recognizer de citations, normaliseurs, parsers de
# sources Légifrance/JORF/KALI, identité. PUR (aucune I/O, aucun client réseau) —
# mais lourd (DFA de citation, parsers XML). Tiré uniquement par lj-ingest et
# lj-bench, jamais par lj-server/lj-api/lj-web : il sort du chemin de service.
# Données embarquées (legifrance_codes.json, instrument_aliases.json, registres
# garble) via include_str! sous packages/lj-extract/data/.
[dependencies]
lj-core = { workspace = true }
lj-dtos = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
aho-corasick = { workspace = true }
rustc-hash = { workspace = true }
quick-xml = { workspace = true }
html-escape = { workspace = true }
rayon = { workspace = true }
xxhash-rust = { workspace = true }
thiserror = { workspace = true }
jiff = { workspace = true }
