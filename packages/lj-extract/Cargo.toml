[package]
name = "lj-extract"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Étage d'ingest : recognizer de citations, normaliseurs, parsers de
# sources Légifrance/JORF/KALI, identité. PUR (aucune I/O, aucun client réseau) —
# mais lourd (DFA de citation, parsers XML). Tiré par l'ingest, jamais par
# lj-server/lj-api/lj-web : il sort du chemin de service.
# Données embarquées (legifrance_codes.json, instrument_aliases.json, registres
# garble) via include_str! sous packages/lj-extract/data/.
[dependencies]
lj-core = { workspace = true }
lj-parse = { workspace = true }
lj-norm = { workspace = true }
lj-versions = { workspace = true }
lj-fold = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
aho-corasick = { workspace = true }
rustc-hash = { workspace = true }
jiff = { workspace = true }
