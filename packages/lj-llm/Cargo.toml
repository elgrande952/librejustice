[package]
name = "lj-llm"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Backends embeddings : Cloudflare Workers AI, OpenAI-HTTP. Cache moka
# in-process. Quantisation / L2-normalisation (ndarray). Client Mistral chat/OCR.
[dependencies]
lj-core = { workspace = true }
# Compteur `embed.auto.served` : quel backend a servi. Le meter est un no-op
# tant qu'aucun binaire n'a installé l'export.
lj-telemetry = { workspace = true }
anyhow = { workspace = true }
# Encodage data-URI base64 du PDF pour l'OCR Mistral (`/v1/ocr`).
base64 = { workspace = true }
reqwest = { workspace = true }
reqwest-middleware = { workspace = true }
reqwest-tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
moka = { workspace = true }
ndarray = { workspace = true }
opentelemetry = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Empreinte xxh3-64 des clés Mistral, stockée en table `mistral_key_status`.
xxhash-rust = { workspace = true }
