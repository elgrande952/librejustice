[package]
name = "lj-web"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }

# cdylib = cible wasm (hydrate) ; rlib = lib SSR consommée par `lj-server` (bin
# de déploiement) + tests.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# --- Leptos (toujours presents, default-features=false ; features fan-out via ssr/hydrate) ---
leptos = { workspace = true }
leptos_router = { workspace = true }
leptos_meta = { workspace = true }
leptos-fetch = { workspace = true }
leptos-use = { version = "0.19.2", default-features = false, optional = true, features = ["on_click_outside", "use_event_listener", "use_intersection_observer", "use_preferred_dark"] }

# --- DTOs (noyau leger serde-pur ; present ssr ET hydrate/wasm) ---
# Without the `jsonschema` feature: pure serde, compiles to wasm32. No lj-core,
# whose embedded tables weigh 9 MB.
lj-dtos = { workspace = true }
lj-fold = { workspace = true }
lj-vocab = { workspace = true }

# --- Client HTTP (ssr: backend rustls/tokio ; wasm: backend fetch du navigateur,
# tls/gzip inertes). Present dans les deux cibles : un seul code client. ---
reqwest = { workspace = true }

# --- serveur uniquement (SSR), gates dep: dans la feature ssr ---
leptos_axum = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The SSR backend is a trait lj-server implements over lj-api: the front does
# not depend on the service layer, whose changes would rebuild it.
async-trait = { workspace = true, optional = true }

# --- client uniquement (hydrate / wasm), gates dep: dans la feature hydrate ---
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { workspace = true, optional = true }
# Les features de web-sys sont additives : une interface qui manque est une
# ligne à ajouter ici, pas un shim JS à écrire.
web-sys = { workspace = true, optional = true, features = [
  "Window",
  "Location",
  "History",
  "Element",
  "HtmlFormElement",
  "Navigator",
  "Clipboard",
  "Storage",
  "IntersectionObserver",
  "IntersectionObserverEntry",
  "IntersectionObserverInit",
  "Document",
  "DomTokenList",
  "MediaQueryList",
  "EventTarget",
  "AddEventListenerOptions",
  "EventListenerOptions",
  "Selection",
  "Range",
  "DomRect",
  "Node",
  "HtmlCollection",
  "ScrollIntoViewOptions",
  "ScrollBehavior",
  "ScrollLogicalPosition",
  "Performance",
  "Blob",
  "BlobPropertyBag",
  "CanvasRenderingContext2d",
  "CssStyleDeclaration",
  "DataTransfer",
  "DragEvent",
  "File",
  "FileList",
  "FontFace",
  "FontFaceSet",
  "HtmlAnchorElement",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlImageElement",
  "HtmlInputElement",
  "ImageBitmap",
  "ImageData",
  "PointerEvent",
  "Response",
  "Url",
] }
send_wrapper = { workspace = true, optional = true }

[features]
# default = ssr : un `cargo build`/`clippy`/`test` workspace host compile le binaire
# serveur (axum/tokio) sur x86_64 — jamais le wasm. La cible wasm passe EXCLUSIVEMENT
# par cargo-leptos (lib-features=["hydrate"], lib-default-features=false).
default = ["ssr"]
hydrate = [
    "leptos/hydrate",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:serde-wasm-bindgen",
    "dep:console_error_panic_hook",
    "dep:web-sys",
    "dep:leptos-use",
    "dep:send_wrapper",
]
ssr = [
    "leptos/ssr",
    "leptos_router/ssr",
    "leptos_meta/ssr",
    "leptos-fetch/ssr",
    "dep:leptos_axum",
    # `default` de leptos_axum = handlers fs (file_and_error_handler / ServeDir).
    "leptos_axum/default",
    "dep:axum",
    "dep:async-trait",
]

# La config cargo-leptos vit au niveau workspace (`[[workspace.metadata.leptos]]`
# dans le Cargo.toml racine) : projet multi-crate bin=lj-server / lib=lj-web.

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
