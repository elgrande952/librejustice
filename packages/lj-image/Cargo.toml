[package]
name = "lj-image"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Raster codecs both document engines share, pure Rust for the browser module.
[dependencies]
flate2 = { workspace = true }
hayro-ccitt = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lj-workspace-hack = { version = "0.1", path = "../lj-workspace-hack" }

[dev-dependencies]
jpeg-decoder = "0.3"
jpeg-encoder = "0.6"
png = "0.18"
